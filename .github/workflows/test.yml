name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node
    # Local dev-pool runner (dev-jules-mcp-1). GitHub-hosted minutes are a single
    # monthly cap shared across every repo on the account; exhausting it blocks
    # CI everywhere at once, which is what happened on 2026-08-23. Pinned to the
    # per-repo label so this repo does not race the other dev-pool runners.
    runs-on: [self-hosted, linux, x64, dev-pool, jules-mcp]
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      # vitest does not typecheck, and nothing else here ran tsc, so a
      # TypeScript error could not fail CI at all. `build` is also what
      # produces dist/ — the package's `main` — so this is the step that
      # proves the shipped entry point can actually be produced.
      - run: npm run build
      - run: npm test

  lint:
    name: eslint
    # Local dev-pool runner (dev-jules-mcp-1). GitHub-hosted minutes are a single
    # monthly cap shared across every repo on the account; exhausting it blocks
    # CI everywhere at once, which is what happened on 2026-08-23. Pinned to the
    # per-repo label so this repo does not race the other dev-pool runners.
    runs-on: [self-hosted, linux, x64, dev-pool, jules-mcp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx eslint .

  pre-commit:
    name: pre-commit
    # Local dev-pool runner (dev-jules-mcp-1). GitHub-hosted minutes are a single
    # monthly cap shared across every repo on the account; exhausting it blocks
    # CI everywhere at once, which is what happened on 2026-08-23. Pinned to the
    # per-repo label so this repo does not race the other dev-pool runners.
    runs-on: [self-hosted, linux, x64, dev-pool, jules-mcp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
