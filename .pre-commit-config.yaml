# See https://pre-commit.com for usage and https://pre-commit.com/hooks.html for more hooks.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # Secret scanning — gitleaks catches leaks before commit; GitHub secret
  # scanning only catches them after push.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.27.0
    hooks:
      - id: eslint
        files: \.ts$
        additional_dependencies:
          - eslint@9.27.0
          - '@eslint/js@9.27.0'
          - typescript-eslint@8.45.0
          - typescript@5.9.3

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier

  # Optional — Dockerfile lint. Uncomment if the repo ships a Dockerfile.
  # hadolint-docker runs the official image, so no Haskell toolchain is needed
  # (the bare `hadolint` id builds from source).
  # - repo: https://github.com/hadolint/hadolint
  #   rev: v2.14.0
  #   hooks:
  #     - id: hadolint-docker
